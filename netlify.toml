[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache aggressivo per asset versionati di Astro
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect 301 dalle vecchie URL Wordpress
[[redirects]]
  from = "/abbonamenti/"
  to = "/abbonamenti"
  status = 301
  force = true

[[redirects]]
  from = "/orari-corsi/"
  to = "/orari"
  status = 301
  force = true

[[redirects]]
  from = "/orari-corsi"
  to = "/orari"
  status = 301
  force = true

